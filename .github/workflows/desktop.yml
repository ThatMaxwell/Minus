name: Build the Minus app

on:
  push:
    branches: [main]
    paths: ["apps/**", "crates/**", "site/app/**", "site/js/**", "site/vendor/**", "site/test.html", "site/dock.html", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: macOS
            os: macos-latest
            bundles: dmg
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: Build the app
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Minus Hands test tool
        if: runner.os == 'Windows'
        run: cargo build --release -p minus-hands
      - name: tar.gz for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p minus && cp target/release/minus minus/ && cp apps/desktop/src-tauri/icons/128x128@2x.png minus/minus.png
          printf '[Desktop Entry]\nName=Minus\nExec=minus\nIcon=minus\nType=Application\nCategories=Utility;\n' > minus/minus.desktop
          tar czf minus-linux-x86_64.tar.gz minus
      - uses: actions/upload-artifact@v4
        with:
          name: Minus-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            minus-linux-x86_64.tar.gz
            target/release/minus-hands.exe

  android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK and NDK (already on GitHub's Linux machines)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: Build the APK
        working-directory: apps/desktop
        run: |
          [ -d src-tauri/gen/android ] || npx tauri android init --ci
          npx tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Minus-Android
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
