name: Build the Minus app

on:
  push:
    branches: [main]
    paths: ["apps/**", "crates/**", "site/app/**", "site/js/**", "site/vendor/**", "site/test.html", "site/dock.html", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: macOS
            os: macos-latest
            bundles: dmg
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: Build the app
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Does it start? (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MINUS_NO_DIALOG = "1"
          Remove-Item "$env:TEMP\minus-crash.log" -ErrorAction SilentlyContinue
          $p = Start-Process target\release\minus.exe -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          Start-Sleep 25
          $crash = Get-Content "$env:TEMP\minus-crash.log" -Raw -ErrorAction SilentlyContinue
          if ($p.HasExited -or $crash) {
            Write-Host "::error::Minus did not stay running (exit code: $($p.ExitCode))"
            Write-Host "--- crash log ---"; Write-Host $crash
            Write-Host "--- stderr ---"; Get-Content err.txt -ErrorAction SilentlyContinue
            Write-Host "--- stdout ---"; Get-Content out.txt -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Minus is running after 25 seconds"
          Get-Process | Where-Object { $_.ProcessName -match 'minus|msedgewebview2' } | Format-Table ProcessName,Id,CPU,WorkingSet64 -Auto
          Stop-Process -Id $p.Id -Force
      - name: Minus Hands test tool
        if: runner.os == 'Windows'
        run: cargo build --release -p minus-hands
      - name: tar.gz for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p minus && cp target/release/minus minus/ && cp apps/desktop/src-tauri/icons/128x128@2x.png minus/minus.png
          printf '[Desktop Entry]\nName=Minus\nExec=minus\nIcon=minus\nType=Application\nCategories=Utility;\n' > minus/minus.desktop
          tar czf minus-linux-x86_64.tar.gz minus
      - uses: actions/upload-artifact@v4
        with:
          name: Minus-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            minus-linux-x86_64.tar.gz
      # the Minus Hands test tool is for developers, so it's kept apart from the app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Minus-Hands-test-tool
          path: target/release/minus-hands.exe

  android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK and NDK (already on GitHub's Linux machines)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      # an optimized build for 64-bit ARM, which is practically every Android phone in use
      - name: Build the APK
        working-directory: apps/desktop
        run: |
          [ -d src-tauri/gen/android ] || npx tauri android init --ci
          npx tauri android build --apk --target aarch64
      # Android only installs signed apps. With the ANDROID_KEYSTORE secret every build is
      # signed by the same key, so a new version installs over the old one; without it a
      # one-off key is made (the app works, but updating means uninstalling first).
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "built: $APK ($(du -h "$APK" | cut -f1))"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > minus.jks; PASS="$KEYSTORE_PASS"
          else
            PASS=minus-preview
            keytool -genkeypair -keystore minus.jks -storepass "$PASS" -keypass "$PASS" -alias minus -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Minus"
          fi
          mkdir -p signed
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks minus.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out signed/Minus-Android.apk aligned.apk
          "$BT/apksigner" verify signed/Minus-Android.apk
          ls -la signed
          rm -f minus.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Minus-Android
          path: signed/Minus-Android.apk

  # direct downloads, no zips: every build of main becomes the "latest" release
  release:
    name: Latest release
    needs: [desktop, android]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
          pattern: Minus-*
      - name: Name the files
        run: |
          mkdir -p out
          pick() { f=$(find built -type f -name "$1" | head -1); [ -n "$f" ] && cp "$f" "out/$2" || echo "missing: $1"; }
          pick '*-setup.exe' Minus-Windows-Setup.exe
          pick '*.msi' Minus-Windows.msi
          pick '*.dmg' Minus-macOS.dmg
          pick '*.AppImage' Minus-Linux.AppImage
          pick '*.deb' Minus-Linux.deb
          pick '*.rpm' Minus-Linux.rpm
          pick 'minus-linux-x86_64.tar.gz' Minus-Linux.tar.gz
          pick '*.apk' Minus-Android.apk
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --prerelease --target "${{ github.sha }}" --title "Minus (latest build)" \
            --notes "The newest build of Minus, straight from main. Windows: Minus-Windows-Setup.exe · Mac: Minus-macOS.dmg · Android: Minus-Android.apk · Linux: Minus-Linux.AppImage. Not code-signed yet, so Windows may say 'Windows protected your PC' (More info → Run anyway) and Android asks to allow installing from your browser."
