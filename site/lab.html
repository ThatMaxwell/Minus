<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minus Mascot Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&display=swap" />
  <style>
    :root { color-scheme: dark; --bg: #0b0b0c; --bg-1: #121214; --bg-2: #1a1a1d; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14); --fg: #ededeb; --fg-2: #a2a2a7; --fg-3: #6c6c72; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
    body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(60% 55% at 50% 42%, #18181b 0%, var(--bg) 70%); }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .brand { position: fixed; top: 22px; left: max(24px, env(safe-area-inset-left)); font: 400 21px/1 "PT Serif", Georgia, serif; letter-spacing: -.02em; z-index: 2; }
    .brand span { font: 13px "Geist", sans-serif; color: var(--fg-3); margin-left: 10px; letter-spacing: 0; }
    .panel { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); translate: -50% 0; z-index: 2; width: min(760px, calc(100vw - 32px));
      display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: rgba(18,18,20,.82); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05); }
    .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .row > b { flex: none; width: 68px; font-weight: 500; font-size: 12.5px; color: var(--fg-3); }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg-2); font: 500 13px "Geist", sans-serif; cursor: pointer; text-transform: capitalize; transition: background .2s, color .2s, border-color .2s, transform .2s cubic-bezier(.34,1.56,.64,1); }
    .chip:hover { color: var(--fg); }
    .chip:active { transform: scale(.95); }
    .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .chip kbd { font: 11px "Geist", sans-serif; opacity: .5; margin-left: 6px; }
    .sw { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); transition: transform .2s; }
    .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 3.5px var(--fg); }
    .hint { position: fixed; top: 24px; right: max(24px, env(safe-area-inset-right)); color: var(--fg-3); font-size: 13px; z-index: 2; }
    @media (max-width: 560px) { .row > b { display: none; } .hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="mx" aria-label="Minus mascot"></canvas>
  <div class="brand">minus<span>Mascot lab</span></div>
  <div class="hint">Move far away and it hops · keys 1–0 change emotion</div>
  <div class="panel">
    <div class="row"><b>Emotion</b><div class="chips" id="emo"></div></div>
    <div class="row"><b>Wear</b><div class="chips" id="cos"></div></div>
    <div class="row"><b>Color</b><div class="chips" id="col"></div></div>
  </div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module">
    import { Mascot3D, EMOTIONS, COSMETICS } from './js/mascot3d.js';
    import { COLORS } from './js/shape.js';
    const m = new Mascot3D(document.getElementById('mx'), { follow: true, room: true });
    const chips = (host, items, onPick, label = (x) => x) => {
      host.innerHTML = '';
      items.forEach((it, i) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.innerHTML = label(it, i); b.setAttribute('aria-pressed', i === 0);
        b.onclick = () => { host.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); onPick(it); };
        host.appendChild(b);
      });
    };
    const emos = Object.keys(EMOTIONS);
    chips(document.getElementById('emo'), emos, (e) => m.setEmotion(e), (e, i) => `${e}<kbd>${(i + 1) % 10}</kbd>`);
    chips(document.getElementById('cos'), Object.keys(COSMETICS), (c) => { m.setCosmetic(c); m.hop(); });
    const col = document.getElementById('col');
    Object.entries(COLORS).forEach(([n, c], i) => {
      const b = document.createElement('button');
      b.className = 'sw'; b.style.background = c; b.title = n; b.setAttribute('aria-label', n); b.setAttribute('aria-pressed', i === 0);
      b.onclick = () => { col.querySelectorAll('.sw').forEach((x) => x.setAttribute('aria-pressed', x === b)); m.setColor(c); m.blink(); };
      col.appendChild(b);
    });
    addEventListener('keydown', (e) => {
      const n = '1234567890'.indexOf(e.key);
      if (n >= 0 && emos[n]) document.querySelectorAll('#emo .chip')[n].click();
    });
    window.__m = m;
  </script>
</body>
</html>
