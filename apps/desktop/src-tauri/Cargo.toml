[package]
name = "minus-desktop"
version = "0.1.0"
description = "Minus: a free, open-source team of AI agents"
authors = ["ThatMaxwell"]
license = "MIT"
edition = "2021"

[lib]
name = "minus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent = { version = "0.1.0", path = "../../../crates/agent" }
hands = { version = "0.1.0", path = "../../../crates/hands" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
