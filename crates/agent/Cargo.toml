[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
hands = { version = "0.1.0", path = "../hands" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
# the web: reading result pages and web pages
scraper = "0.24"
percent-encoding = "2"

# the agents' own browser (desktop only: phones don't run one)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio-tungstenite = "0.28"

[target.'cfg(target_os = "android")'.dependencies]
# Android: trust the standard root certificates (see http_client)
webpki-root-certs = "1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
