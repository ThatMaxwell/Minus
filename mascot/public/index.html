<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minus Mascot</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --pill: #1b1b1d;
      --pill-hover: #252528;
      --text: #ededee;
      --muted: #77777c;
      --line: #2a2a2d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
      font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .brand { position: fixed; top: 22px; left: 26px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 8px; user-select: none; }
    .brand i { width: 14px; height: 3px; border-radius: 3px; background: var(--text); display: inline-block; }

    .dock { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .row { display: flex; gap: 8px; align-items: center; }
    button.anim { appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500;
      color: var(--text); background: var(--pill); padding: 10px 18px; border-radius: 999px;
      transition: background .18s ease, transform .18s cubic-bezier(.3,1.6,.5,1); }
    button.anim:hover { background: var(--pill-hover); }
    button.anim:active { transform: scale(.94); }
    button.anim kbd { font: inherit; font-size: 11px; color: var(--muted); margin-left: 8px;
      border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

    .swatches { display: flex; gap: 10px; padding: 8px 12px; border-radius: 999px; background: #121214; }
    .swatch { width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
      box-shadow: 0 0 0 0 var(--bg), 0 0 0 0 transparent; transition: box-shadow .2s ease, transform .2s ease; }
    .swatch:hover { transform: scale(1.12); }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #121214, 0 0 0 3.5px var(--text); }

    @media (max-width: 480px) { .dock { bottom: 24px; } .brand { left: 16px; top: 16px; } }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Minus mascot"></canvas>
  <div class="brand"><i></i>minus</div>

  <div class="dock">
    <div class="row">
      <button class="anim" id="blink">Blink<kbd>B</kbd></button>
      <button class="anim" id="look">Look<kbd>L</kbd></button>
    </div>
    <div class="swatches" id="swatches" role="group" aria-label="Agent color"></div>
  </div>

  <script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
  <script type="module" src="/mascot.js"></script>
</body>
</html>
